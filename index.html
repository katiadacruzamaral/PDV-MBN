 const msg=t=>document.getElementById('auth-error').textContent=t;
 async function hydrate(user) { const r=await client.from('pdv_state').select('payload').eq('user_id',user.id).maybeSingle(); if(r.error) throw r.error; if(r.data?.payload) originalSetItem.call(localStorage,'viva-pdv',JSON.stringify(r.data.payload)); sessionStorage.setItem('pdv-hydrated','1'); window.__pdvDataHydrated=true; window.__pdvRefresh?.(); }
 async function start() { const r=await client.auth.getSession(); window.__pdvCurrentUser=r.data?.session?.user||null; if(r.error) return msg('Não foi possível verificar a sessão.'); if(!r.data.session) return; if(sessionStorage.getItem('pdv-hydrated')!=='1') { try { await hydrate(r.data.session.user); } catch(e) { msg('Execute o SQL do Supabase antes de entrar.'); return; } } gate.hidden=true; window.__pdvSyncReady=true; refreshUserIdentity(); const pill=document.createElement('div'); pill.id='sync-pill'; pill.className='sync-pill'; pill.textContent='● Sincronizado'; document.body.appendChild(pill); const logout=document.createElement('button'); logout.className='logout-pdv'; logout.textContent='Sair'; logout.onclick=async()=>{sessionStorage.removeItem('pdv-hydrated');await client.auth.signOut();location.reload()}; document.body.appendChild(logout); }
 document.getElementById('auth-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');b.disabled=true;msg('');const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value,r=await client.auth.signInWithPassword({email,password});if(r.error)msg(r.error.message.includes('Invalid')?'E-mail ou senha inválidos.':r.error.message);else try{await hydrate(r.data.user)}catch(x){msg('A conta entrou, mas a tabela do PDV ainda não está configurada.')}b.disabled=false};
 document.getElementById('auth-signup').onclick=async()=>{const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value,r=await client.auth.signUp({email,password});msg(r.error?r.error.message:'Usuário criado. Confirme o e-mail e depois entre.')};
 Storage.prototype.setItem=function(k,v){originalSetItem.call(this,k,v);if(this===localStorage&&k==='viva-pdv'&&window.__pdvSyncReady){clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{const u=await client.auth.getUser();if(!u.data.user)return;const r=await client.from('pdv_state').upsert({user_id:u.data.user.id,payload:JSON.parse(v),updated_at:new Date().toISOString()},{onConflict:'user_id'});const p=document.getElementById('sync-pill');if(p){p.textContent=r.error?'● Local — aguardando conexão':'● Sincronizado';p.classList.toggle('offline',!!r.error)}},500)}};
 start();

<script>
function userDisplayName(){return 'Mensageiros da Boa Nova'}
function refreshUserIdentity(){const name='Mensageiros da Boa Nova';const avatar='MB';const n=document.getElementById('user-name'),r=document.getElementById('user-role'),a=document.getElementById('user-avatar');if(n)n.textContent=name;if(r)r.textContent=name;if(a)a.textContent=avatar;}

const seed={stockEntries:[{id:1,product:1,qty:20,date:'2026-08-20'},{id:2,product:2,qty:15,date:'2026-08-21'}],clients:[{id:1,code:1001,name:'Mariana Costa',phone:'(11) 98888-1234',cpf:'123.456.789-09'},{id:2,code:1002,name:'João Pedro Silva',phone:'(11) 97777-2345',cpf:'987.654.321-00'},{id:3,code:1003,name:'Camila Oliveira',phone:'(11) 96666-3456',cpf:'111.222.333-44'}],events:[{id:1,name:'Retiro de Jovens 2026',active:true},{id:2,name:'Encontro de Casais',active:true},{id:3,name:'Conferência da Igreja',active:false}],payments:[{id:1,name:'PIX',mode:'auto',active:true},{id:2,name:'Dinheiro',mode:'auto',active:true},{id:3,name:'Pagamento futuro',mode:'future',active:true}],products:[{id:1,code:2001,name:'Camiseta do Retiro',price:45,stock:32,min:10,active:true},{id:2,code:2002,name:'Caneca Viva',price:28,stock:18,min:8,active:true},{id:3,code:2003,name:'Livro devocional',price:35,stock:6,min:10,active:true},{id:4,code:2004,name:'Cordão de identificação',price:8,stock:74,min:20,active:true}],sales:[{id:1042,date:'2026-08-29',client:1,event:1,payment:1,status:'Recebido',items:[{product:1,qty:1,price:45}],total:45},{id:1041,date:'2026-08-29',client:2,event:1,payment:3,status:'Pendente',items:[{product:2,qty:2,price:28}],total:56},{id:1040,date:'2026-08-28',client:3,event:2,payment:2,status:'Recebido',items:[{product:3,qty:1,price:35},{product:4,qty:1,price:8}],total:43},{id:1039,date:'2026-08-28',client:1,event:1,payment:3,status:'Pendente',items:[{product:1,qty:1,price:45}],total:45}]};
let data;try{data=JSON.parse(localStorage.getItem('viva-pdv')||'null')}catch(e){data=null}if(!data||typeof data!=='object'||!Array.isArray(data.products)||!Array.isArray(data.sales))data=JSON.parse(JSON.stringify(seed));['clients','events','payments','products','sales','stockEntries'].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});data.products.forEach(p=>{p.stock=Number(p.stock)||0;p.active=p.active!==false});let current='dashboard',saleItems=[];const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0),by=(a,id)=>a.find(x=>x.id==id)||{},fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—',today=()=>new Date().toISOString().slice(0,10);function save(){try{localStorage.setItem('viva-pdv',JSON.stringify(data));return true}catch(e){toast('Não foi possível salvar os dados neste navegador');return false}}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),2300)}function next(a,k){return Math.max(0,...a.map(x=>Number(x[k])||0))+1}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function maskPhone(v){let d=String(v).replace(/\D/g,'').slice(0,11);if(d.length<=2)return d?'('+d: '';return '('+d.slice(0,2)+')'+(d.length>7?d.slice(2,7)+'-'+d.slice(7):d.slice(2))}function maskCpf(v){let d=String(v).replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}function maskMoney(v){let d=String(v).replace(/\D/g,'');return d?((Number(d)/100).toFixed(2)):''}function moneyInput(v){return (Number(v)||0).toFixed(2)}function shell(t,sub,b=''){return `<div class="intro"><div><h1>${t}</h1><p>${sub}</p></div>${b?`<button class="primary" onclick="${b}">＋ ${t==='Nova venda'?'Finalizar venda':'Novo cadastro'}</button>`:''}</div>`}function badge(s){return `<span class="badge ${s==='Recebido'?'received':s==='Pendente'?'pending':'cancelled'}">${s}</span>`}function filteredSales(){const c=[...document.querySelectorAll('#cash-client option:checked')].map(x=>x.value),e=document.getElementById('cash-event')?.value||'',st=document.getElementById('cash-status')?.value||'',q=(document.getElementById('cash-search')?.value||'').replace('#','');return data.sales.filter(s=>(!c.length||c.includes(String(s.client)))&&(!e||s.event==e)&&(!st||s.status===st)&&(!q||String(s.id).includes(q)))}function saleRows(list){return list.map(s=>`<tr><td><input type="checkbox" class="cash-check" value="${s.id}" ${s.status==='Cancelado'?'disabled':''}></td><td><b>#${s.id}</b></td><td>${fmtDate(s.date)}</td><td>${esc(by(data.clients,s.client).name||'Consumidor')}</td><td>${esc(by(data.events,s.event).name)}</td><td>${money(s.total)}</td><td>${badge(s.status)}</td><td>${s.status==='Pendente'?`<button class="secondary" onclick="receive(${s.id})">Dar baixa</button> `:''}${s.status!=='Cancelado'?`<button class="icon-danger" onclick="cancelSale(${s.id})">Cancelar e devolver</button> <button class="danger" onclick="deleteSale(${s.id})">Excluir sem devolver</button>`:`<button class="danger" onclick="deleteSale(${s.id})">Excluir lançamento</button>`}</td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">Nenhum lançamento encontrado.</div></td></tr>`}function cashTotals(list){const active=list.filter(s=>s.status!=='Cancelado');return{total:active.reduce((a,s)=>a+s.total,0),received:active.filter(s=>s.status==='Recebido').reduce((a,s)=>a+s.total,0),pending:active.filter(s=>s.status==='Pendente').reduce((a,s)=>a+s.total,0)}}
function renderDashboard(){let low=data.products.filter(p=>p.active&&p.stock<=p.min),t=data.sales.filter(s=>s.date===today()).reduce((a,s)=>a+s.total,0);document.getElementById('dashboard').innerHTML=shell('Olá, ' + userDisplayName() + ' 👋','Acompanhe a operação do seu evento em tempo real.','go(\'sale\')')+`<div class="cards"><div class="card metric"><small>Vendas hoje</small><h2>${money(t)}</h2><p class="up">${data.sales.filter(s=>s.date===today()).length} lançamentos</p><div class="icon blue">▣</div></div><div class="card metric"><small>Recebido</small><h2>${money(data.sales.filter(s=>s.status==='Recebido').reduce((a,s)=>a+s.total,0))}</h2><p class="up">${data.sales.filter(s=>s.status==='Recebido').length} lançamentos</p><div class="icon green">✓</div></div><div class="card metric"><small>A receber</small><h2>${money(data.sales.filter(s=>s.status==='Pendente').reduce((a,s)=>a+s.total,0))}</h2><p style="color:var(--orange)">${data.sales.filter(s=>s.status==='Pendente').length} pendentes</p><div class="icon orange">◷</div></div><div class="card metric"><small>Estoque baixo</small><h2>${low.length} ${low.length?'itens':''}</h2><p class="muted">Requer atenção</p><div class="icon red">!</div></div></div><div class="grid2"><div class="panel"><div class="panel-head"><h3>Vendas recentes</h3><a onclick="go('cash')">Ver todas →</a></div><div class="table-wrap"><table class="table"><thead><tr><th></th><th>Venda</th><th>Data</th><th>Cliente</th><th>Evento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${saleRows(data.sales.slice(0,5))}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3>Estoque baixo</h3><a onclick="go('stock')">Ver estoque →</a></div><div class="stock-list">${low.map(p=>`<div class="stock-row"><div><strong>${esc(p.name)}</strong><div class="bar"><span style="width:${Math.min(100,p.stock/Math.max(1,p.min)*100)}%;background:${p.stock<p.min/2?'#d84e5e':'#e49b2e'}"></span></div></div><small><b>${p.stock}</b> / mínimo ${p.min}</small></div>`).join('')||'<div class="empty">Estoque saudável</div>'}</div></div></div>`}
function tableRows(kind){return data[kind].map(x=>kind==='clients'?`<tr><td><b>#${x.code}</b></td><td><b>${esc(x.name)}</b></td><td>${esc(x.phone||'')}</td><td>${esc(x.cpf||'')}</td><td><span class="badge received">Ativo</span></td><td><button class="secondary" onclick="editClient(${x.id})">Editar</button> <button class="icon-danger" onclick="deleteClient(${x.id})">Excluir</button></td></tr>`:kind==='products'?`<tr><td><b>#${x.code}</b></td><td><b>${esc(x.name)}</b></td><td>${money(x.price)}</td><td>${x.stock} un.</td><td><span class="badge ${x.active?'received':'cancelled'}">${x.active?'Ativo':'Inativo'}</span></td><td><button class="secondary" onclick="editProduct(${x.id})">Editar</button> <button class="secondary" onclick="toggleProduct(${x.id})">${x.active?'Inativar':'Ativar'}</button> <button class="icon-danger" onclick="deleteProduct(${x.id})">Excluir</button></td></tr>`:kind==='events'?`<tr><td><b>${esc(x.name)}</b></td><td>${data.sales.filter(s=>s.event===x.id).length}</td><td>${money(data.sales.filter(s=>s.event===x.id).reduce((a,s)=>a+s.total,0))}</td><td><span class="badge ${x.active?'received':'cancelled'}">${x.active?'Ativo':'Inativo'}</span></td><td><button class="secondary" onclick="toggleEvent(${x.id})">${x.active?'Inativar':'Ativar'}</button> <button class="icon-danger" onclick="deleteEvent(${x.id})">Excluir</button></td></tr>`:`<tr><td><b>${esc(x.name)}</b></td><td>${x.mode==='auto'?'<span class="badge received">Baixa Automática</span>':'<span class="badge pending">Baixa Futura</span>'}</td><td>${data.sales.filter(s=>s.payment===x.id).length}</td><td><span class="badge received">Ativo</span></td><td><button class="secondary" onclick="editPayment(${x.id})">Editar</button> <button class="icon-danger" onclick="deletePayment(${x.id})">Excluir</button></td></tr>`).join('')}
function renderClients(){document.getElementById('clients').innerHTML=shell('Clientes','Cadastre e consulte os participantes.')+`<div class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input placeholder="Buscar por nome, CPF ou código..." oninput="filterTable(this,'clients-table')"></div><button class="primary" onclick="newClient()">＋ Novo cliente</button></div><table class="table" id="clients-table"><thead><tr><th>Código</th><th>Nome</th><th>Telefone</th><th>CPF</th><th>Status</th><th></th></tr></thead><tbody>${tableRows('clients')}</tbody></table></div>`}function renderProducts(){document.getElementById('products').innerHTML=shell('Produtos','Controle seu catálogo e estoque.')+`<div class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input placeholder="Buscar produto por nome ou código..." oninput="filterTable(this,'products-table')"></div><button class="primary" onclick="newProduct()">＋ Novo produto</button></div><table class="table" id="products-table"><thead><tr><th>Código</th><th>Produto</th><th>Preço</th><th>Estoque</th><th>Status</th><th></th></tr></thead><tbody>${tableRows('products')}</tbody></table></div>`}function renderEvents(){document.getElementById('events').innerHTML=shell('Eventos','Organize as vendas por encontro, retiro ou conferência.')+`<div class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input placeholder="Buscar evento..." oninput="filterTable(this,'events-table')"></div><button class="primary" onclick="newEvent()">＋ Novo evento</button></div><table class="table" id="events-table"><thead><tr><th>Evento</th><th>Vendas</th><th>Faturamento</th><th>Status</th><th></th></tr></thead><tbody>${tableRows('events')}</tbody></table></div>`}function renderPayments(){document.getElementById('payments').innerHTML=shell('Formas de pagamento','Defina como cada recebimento será lançado.')+`<div class="panel"><div class="toolbar"><button class="primary" onclick="newPayment()">＋ Nova forma</button></div><table class="table"><thead><tr><th>Forma</th><th>Tipo de lançamento</th><th>Vendas</th><th>Status</th><th></th></tr></thead><tbody>${tableRows('payments')}</tbody></table></div>`}
function renderStock(){let entries=[...data.stockEntries].sort((a,b)=>b.id-a.id);document.getElementById('stock').innerHTML=shell('Estoque','Registre, edite e acompanhe as entradas.')+`<div class="notice">O saldo é alterado somente por movimentações de estoque e vendas concluídas.</div><div class="panel form-panel"><h3>Registrar entrada de estoque</h3><div class="form-grid" style="margin-top:16px"><div class="field wide"><label>Produto</label><input id="stock-prod" list="stock-products" placeholder="Digite o nome ou código do produto" autocomplete="off"><datalist id="stock-products">${data.products.filter(p=>p.active).map(p=>`<option value="${esc(p.name)}">#${p.code} · ${esc(p.name)}</option><option value="${p.code}">${esc(p.name)}</option>`).join('')}</datalist></div><div class="field"><label>Quantidade de entrada</label><input type="number" id="stock-qty" min="1" step="1" value="" placeholder="Digite a quantidade"></div><div class="actions"><button class="primary" type="button" onclick="addStock()">Registrar entrada</button></div></div></div><div class="panel"><div class="panel-head"><h3>Posição atual</h3><span class="muted">${data.products.length} produtos cadastrados</span></div><table class="table"><thead><tr><th>Produto</th><th>Código</th><th>Estoque atual</th><th>Mínimo</th><th>Situação</th></tr></thead><tbody>${data.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>#${p.code}</td><td><b>${p.stock}</b> un.</td><td>${p.min} un.</td><td>${p.stock<=p.min?'<span class="badge pending">Repor estoque</span>':'<span class="badge received">Normal</span>'}</td></tr>`).join('')}</tbody></table></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Histórico de entradas</h3><span class="muted">${entries.length} registros</span></div><table class="table"><thead><tr><th>Data</th><th>Produto</th><th>Quantidade</th><th></th></tr></thead><tbody>${entries.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(by(data.products,e.product).name||'Produto removido')}</td><td>+${e.qty} un.</td><td><button class="secondary" onclick="editStockEntry(${e.id})">Editar</button> <button class="icon-danger" onclick="deleteStockEntry(${e.id})">Excluir</button></td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Nenhuma entrada registrada.</div></td></tr>'}</tbody></table></div>`}function lookupText(value){return String(value||'').trim().toLowerCase().replace(/\s+·\s+#\d+$/,'').trim()}function resolveProduct(value){const raw=String(value||'').trim().toLowerCase(),q=lookupText(value);return data.products.find(p=>String(p.id)===raw||String(p.code).toLowerCase()===raw||p.name.toLowerCase()===q)}function resolveClient(value){const raw=String(value||'').trim().toLowerCase(),q=lookupText(value);return data.clients.find(c=>String(c.id)===raw||String(c.code).toLowerCase()===raw||c.name.toLowerCase()===q)}function resolveEvent(value){const raw=String(value||'').trim().toLowerCase(),q=lookupText(value);return data.events.find(e=>String(e.id)===raw||e.name.toLowerCase()===q)}function addStock(){const prod=resolveProduct(document.getElementById('stock-prod')?.value),qty=Number(document.getElementById('stock-qty')?.value);if(!prod||!Number.isSafeInteger(qty)||qty<=0||qty>1000000)return toast('Informe um produto e uma quantidade inteira maior que zero');prod.stock+=qty;data.stockEntries.push({id:next(data.stockEntries,'id'),product:prod.id,qty,date:today()});if(save()){toast('Entrada registrada');renderStock()}}function editStockEntry(id){const e=by(data.stockEntries,id),p=by(data.products,e.product);modal('Editar entrada',[{id:'qty',label:'Quantidade',type:'number',value:e.qty},{id:'date',label:'Data',type:'date',value:e.date}],o=>{const q=Number(o.qty);if(!Number.isSafeInteger(q)||q<=0)return toast('Quantidade inválida');p.stock+=q-e.qty;e.qty=q;e.date=o.date||today();if(save()){toast('Entrada atualizada');renderStock()}})}function deleteStockEntry(id){const e=by(data.stockEntries,id);if(!e.id||!confirm('Excluir esta entrada e estornar o estoque?'))return;const p=by(data.products,e.product);if(p.id)p.stock=Math.max(0,p.stock-e.qty);data.stockEntries=data.stockEntries.filter(x=>x.id!==id);save();toast('Entrada excluída');renderStock()}
function filterCashClients(input){const q=(input.value||'').toLowerCase().trim();document.querySelectorAll('#cash-client option').forEach(o=>{o.hidden=!!q&&!o.textContent.toLowerCase().includes(q)})}function renderCash(){let l=data.sales,t=cashTotals(l);document.getElementById('cash').innerHTML=shell('Caixa','Acompanhe recebimentos e faça baixas em lote.')+`<div class="report-cards"><div class="card report-card"><small>Total filtrado</small><strong id="cash-total">${money(t.total)}</strong></div><div class="card report-card"><small>Recebido</small><strong id="cash-received" style="color:var(--green)">${money(t.received)}</strong></div><div class="card report-card"><small>Pendente</small><strong id="cash-pending" style="color:var(--orange)">${money(t.pending)}</strong></div></div><div class="panel"><div class="filters"><div class="field"><label>Clientes (selecione vários)</label><input id="cash-client-search" placeholder="Pesquisar cliente por nome" oninput="filterCashClients(this)" autocomplete="off" style="margin-bottom:7px;width:100%"><select id="cash-client" multiple size="3" onchange="cashFilter()">${data.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Evento</label><select id="cash-event" onchange="cashFilter()"><option value="">Todos os eventos</option>${data.events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Pagamento</label><select id="cash-status" onchange="cashFilter()"><option value="">Todos os status</option><option value="Pendente">Pagamento pendente</option><option value="Recebido">Recebido</option></select></div><div class="field"><label>Buscar venda</label><input id="cash-search" placeholder="#1042" oninput="cashFilter()"></div></div><div class="toolbar"><button class="secondary" onclick="selectPendingVisible()">Selecionar pendentes visíveis</button><button class="primary" onclick="receiveSelected()">Dar baixa selecionados</button><span class="muted" id="cash-selection">0 selecionados</span></div><div class="table-wrap"><table class="table"><thead><tr><th><input type="checkbox" onchange="toggleAllCash(this)"></th><th>Venda</th><th>Data</th><th>Cliente</th><th>Evento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody id="cash-body">${saleRows(l)}</tbody></table></div></div>`}function cashFilter(){const l=filteredSales(),t=cashTotals(l);document.getElementById('cash-body').innerHTML=saleRows(l);document.getElementById('cash-total').textContent=money(t.total);document.getElementById('cash-received').textContent=money(t.received);document.getElementById('cash-pending').textContent=money(t.pending);updateSelection()}function updateSelection(){const n=document.querySelectorAll('.cash-check:checked').length;const e=document.getElementById('cash-selection');if(e)e.textContent=n+' selecionado'+(n===1?'':'s')}function toggleAllCash(x){document.querySelectorAll('.cash-check:not(:disabled)').forEach(c=>c.checked=x.checked);updateSelection()}function selectPendingVisible(){document.querySelectorAll('.cash-check:not(:disabled)').forEach(c=>c.checked=true);updateSelection()}function receiveSelected(){const ids=[...document.querySelectorAll('.cash-check:checked')].map(x=>Number(x.value));if(!ids.length)return toast('Selecione ao menos um lançamento pendente');receiveBatch(ids)}function receive(id){receiveBatch([id])}function cancelSale(id){const s=by(data.sales,id);if(!s.id||s.status==='Cancelado')return;if(!confirm('Cancelar este lançamento e devolver os produtos ao estoque?'))return;s.items.forEach(i=>{const p=by(data.products,i.product);if(p.id)p.stock+=Number(i.qty)||0});s.status='Cancelado';s.cancelledDate=today();if(save()){toast('Lançamento cancelado; produtos devolvidos ao estoque');renderCash()}}function deleteSale(id){const s=by(data.sales,id);if(!s.id)return;if(!confirm('Excluir este lançamento sem devolver os produtos ao estoque?'))return;data.sales=data.sales.filter(x=>x.id!==id);if(save()){toast('Lançamento excluído sem devolver produtos ao estoque');renderCash()}}function receiveBatch(ids){modal('Registrar recebimento',[{id:'payment',label:'Forma de pagamento',type:'select',options:data.payments.filter(p=>p.active).map(p=>({value:p.id,label:p.name})),value:by(data.sales,ids[0]).payment},{id:'date',label:'Data do pagamento',type:'date',value:today()}],o=>{let changed=0;ids.forEach(id=>{const s=by(data.sales,id);if(s.status==='Pendente'){s.status='Recebido';s.receivedPayment=Number(o.payment);s.receivedDate=o.date||today();changed++}});if(save()){toast(changed+' recebimento'+(changed===1?'':'s')+' confirmado'+(changed===1?'':'s'));renderCash()}})}
function renderSale(){saleItems=[];document.getElementById('sale').innerHTML=shell('Nova venda','Registre uma venda de forma rápida e segura.')+`<div class="sale-layout"><div><div class="panel form-panel"><h3>Dados da venda</h3><div class="form-grid" style="margin-top:16px"><div class="field"><label>Data</label><input id="sale-date" type="date" value="${today()}"></div><div class="field"><label>Cliente</label><input id="sale-client" list="sale-clients" placeholder="Digite o nome ou código (opcional)" autocomplete="off"><datalist id="sale-clients">${data.clients.map(c=>`<option value="${esc(c.name)} · #${c.code}">${esc(c.name)}</option><option value="${c.code}">${esc(c.name)}</option>`).join('')}</datalist></div><div class="field"><label>Evento</label><input id="sale-event" list="sale-events" placeholder="Digite o nome ou código" autocomplete="off"><datalist id="sale-events">${data.events.filter(e=>e.active).map(e=>`<option value="${esc(e.name)} · #${e.id}">${esc(e.name)}</option><option value="${e.id}">${esc(e.name)}</option>`).join('')}</datalist></div><div class="field"><label>Forma de pagamento</label><input id="sale-payment" list="sale-payments" placeholder="Digite ou selecione a forma" value="" oninput="paymentHint()" autocomplete="off"><datalist id="sale-payments">${data.payments.filter(p=>p.active).map(p=>`<option value="${esc(p.name)}">${p.mode==='future'?'Baixa Futura':'Baixa Automática'}</option>`).join('')}</datalist><small id="payment-hint" class="muted">Selecione uma forma de pagamento</small></div></div></div><div class="panel sale-items"><div class="panel-head"><h3>Itens da venda</h3><span class="muted" id="item-count">0 itens</span></div><div class="line-add"><div class="field"><label>Produto</label><input id="item-product" list="item-products" placeholder="Digite o nome ou código do produto" autocomplete="off" oninput="itemProductChanged()"><datalist id="item-products">${data.products.filter(p=>p.active).map(p=>`<option value="${esc(p.name)} · #${p.code}">${esc(p.name)} (${p.stock} un.)</option><option value="${p.code}">${esc(p.name)} (${p.stock} un.)</option>`).join('')}</datalist></div><div class="field"><label>Qtd.</label><input id="item-qty" type="number" min="1" value="1"></div><div class="field"><label>Preço unitário (R$)</label><input id="item-price" inputmode="decimal" value="" placeholder="Selecione um produto" oninput="this.value=maskMoney(this.value)"></div><button class="primary" onclick="addItem()">Adicionar</button></div><div class="table-wrap" style="margin-top:20px"><table class="table"><thead><tr><th>Produto</th><th>Qtd.</th><th>Preço</th><th>Total</th><th></th></tr></thead><tbody id="items-body"><tr><td colspan="5"><div class="empty">Adicione os produtos da venda acima.</div></td></tr></tbody></table></div></div></div><div class="panel summary"><h3>Resumo da venda</h3><div class="sumline"><span>Subtotal</span><b id="sum-sub">R$ 0,00</b></div><div class="sumline total"><span>Total</span><span id="sum-total">R$ 0,00</span></div><div class="notice" style="margin-top:17px;margin-bottom:0">O status será definido automaticamente.</div><button class="primary" style="width:100%;margin-top:15px" onclick="finishSale()">Finalizar venda</button></div></div>`;itemProductChanged()}function itemProductChanged(){const p=resolveProduct(document.getElementById('item-product')?.value);if(p)document.getElementById('item-price').value=moneyInput(p.price)}function addItem(){const p=resolveProduct(document.getElementById('item-product').value),qty=Number(document.getElementById('item-qty').value),price=Number(document.getElementById('item-price').value.replace(',','.'));if(!p?.id||!Number.isSafeInteger(qty)||qty<1||qty>p.stock||!Number.isFinite(price)||price<0)return toast('Confira produto, quantidade, estoque e preço');saleItems.push({product:p.id,qty,price});updateItems()}function updateItems(){document.getElementById('items-body').innerHTML=saleItems.map((i,n)=>`<tr><td><b>${esc(by(data.products,i.product).name)}</b></td><td>${i.qty}</td><td>${money(i.price)}</td><td><b>${money(i.qty*i.price)}</b></td><td><button class="danger" onclick="saleItems.splice(${n},1);updateItems()">Remover</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">Adicione os produtos da venda acima.</div></td></tr>`;const total=saleItems.reduce((a,i)=>a+i.qty*i.price,0);document.getElementById('sum-sub').textContent=money(total);document.getElementById('sum-total').textContent=money(total);document.getElementById('item-count').textContent=saleItems.reduce((a,i)=>a+i.qty,0)+' itens'}function paymentHint(){const p=resolvePayment(document.getElementById('sale-payment')?.value);const hint=document.getElementById('payment-hint');if(hint)hint.textContent=p?(p.mode==='auto'?'Baixa automática':'Baixa futura'):'Selecione uma forma de pagamento'}function resolvePayment(value){const raw=String(value||'').trim().toLowerCase(),q=lookupText(value);return data.payments.find(p=>p.active&&(String(p.id)===raw||p.name.toLowerCase()===q||p.name.toLowerCase().includes(q)&&q.length>1))}function finishSale(){if(!saleItems.length)return toast('Adicione ao menos um produto');const total=saleItems.reduce((a,i)=>a+i.qty*i.price,0),pay=resolvePayment(document.getElementById('sale-payment')?.value);if(!pay?.id)return toast('Selecione uma forma de pagamento');for(const i of saleItems){if(by(data.products,i.product).stock<i.qty)return toast('Estoque insuficiente')}saleItems.forEach(i=>by(data.products,i.product).stock-=i.qty);const client=resolveClient(document.getElementById('sale-client')?.value),event=resolveEvent(document.getElementById('sale-event')?.value);if(!event?.id)return toast('Selecione um evento válido');data.sales.unshift({id:next(data.sales,'id')+1000,date:document.getElementById('sale-date').value,client:client?.id||null,event:event.id,payment:pay.id,status:pay.mode==='auto'?'Recebido':'Pendente',items:saleItems,total});if(save()){toast('Venda registrada com sucesso');saleItems=[];go('sale')}}
function modal(title,fields,cb){const vals=fields.map(f=>f.type==='select'?`<div class="field"><label>${f.label}</label><select id="modal-${f.id}">${(f.options||[]).map(o=>`<option value="${o.value}" ${o.value==f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`:`<div class="field"><label>${f.label}</label><input id="modal-${f.id}" value="${esc(f.value||'')}" type="${f.type||'text'}" ${f.id==='phone'?'oninput="this.value=maskPhone(this.value)"':''} ${f.id==='cpf'?'oninput="this.value=maskCpf(this.value)"':''} ${f.id==='price'?'inputmode="decimal" oninput="this.value=maskMoney(this.value)"':''}></div>`).join('');const wrap=document.createElement('div');wrap.style.cssText='position:fixed;inset:0;background:#10233d99;display:grid;place-items:center;padding:20px;z-index:4';wrap.innerHTML=`<div class="panel" style="width:min(560px,100%)"><div class="panel-head"><h3>${title}</h3><button class="secondary" onclick="this.closest('.pdv-modal').remove()">Fechar</button></div><div class="form-grid" style="grid-template-columns:1fr 1fr">${vals}</div><div class="actions"><button class="primary" id="modal-save">Salvar</button></div></div>`;wrap.className='pdv-modal';document.body.appendChild(wrap);wrap.querySelector('#modal-save').onclick=()=>{const o={};fields.forEach(f=>o[f.id]=wrap.querySelector('#modal-'+f.id).value);const result=cb(o);if(result!==false&&wrap.isConnected)wrap.remove()}}function removeById(a,id,label,after){const x=by(a,id);if(!x.id||!confirm('Excluir '+label+'? Esta ação não pode ser desfeita.'))return;if(a===data.products&&data.sales.some(s=>s.items.some(i=>i.product==id)))return toast('Produto usado em venda não pode ser excluído; inative-o');a.splice(a.findIndex(y=>y.id==id),1);save();toast('Registro excluído');after()}function validateClient(o){if(!o.name.trim())return toast('Informe o nome do cliente'),false;if(!o.phone.replace(/\D/g,'').length)return toast('Informe o telefone do cliente'),false}function newClient(){modal('Novo cliente',[{id:'name',label:'Nome completo'},{id:'phone',label:'Telefone'},{id:'cpf',label:'CPF'}],o=>{if(validateClient(o)===false)return false;data.clients.push({id:next(data.clients,'id'),code:next(data.clients,'code'),name:o.name,phone:maskPhone(o.phone),cpf:maskCpf(o.cpf)});save();renderClients();toast('Cliente cadastrado')})}function editClient(id){const c=by(data.clients,id);modal('Editar cliente',[{id:'name',label:'Nome completo',value:c.name},{id:'phone',label:'Telefone',value:c.phone},{id:'cpf',label:'CPF',value:c.cpf}],o=>{if(validateClient(o)===false)return false;Object.assign(c,{name:o.name,phone:maskPhone(o.phone),cpf:maskCpf(o.cpf)});save();renderClients();toast('Cliente atualizado')})}function newProduct(){modal('Novo produto',[{id:'name',label:'Nome do produto'},{id:'price',label:'Preço de venda',value:'0.00'},{id:'stock',label:'Estoque inicial',type:'number',value:'0'},{id:'min',label:'Estoque mínimo',type:'number',value:'0'}],o=>{const initial=Number(o.stock)||0,p={id:next(data.products,'id'),code:next(data.products,'code'),name:o.name,price:Number(o.price.replace(',','.'))||0,stock:0,min:Number(o.min)||0,active:true};data.products.push(p);if(initial>0){p.stock=initial;data.stockEntries.push({id:next(data.stockEntries,'id'),product:p.id,qty:initial,date:today()})}save();renderProducts();toast('Produto cadastrado')})}function editProduct(id){const p=by(data.products,id);modal('Editar produto',[{id:'name',label:'Nome',value:p.name},{id:'price',label:'Preço',value:moneyInput(p.price)},{id:'min',label:'Estoque mínimo',type:'number',value:p.min}],o=>{p.name=o.name;p.price=Number(o.price.replace(',','.'))||0;p.min=Number(o.min)||0;save();renderProducts();toast('Produto atualizado')})}function toggleProduct(id){const p=by(data.products,id);p.active=!p.active;save();renderProducts();toast(p.active?'Produto ativado':'Produto inativado')}function deleteProduct(id){removeById(data.products,id,'este produto',renderProducts)}function newEvent(){modal('Novo evento',[{id:'name',label:'Nome do evento'}],o=>{data.events.push({id:next(data.events,'id'),name:o.name,active:true});save();renderEvents();toast('Evento cadastrado')})}function toggleEvent(id){const e=by(data.events,id);e.active=!e.active;save();renderEvents();toast('Status atualizado')}function deleteEvent(id){removeById(data.events,id,'este evento',renderEvents)}function newPayment(){modal('Nova forma de pagamento',[{id:'name',label:'Nome da forma'},{id:'mode',label:'Tipo de baixa',type:'select',options:[{value:'auto',label:'Baixa Automática'},{value:'future',label:'Baixa Futura'}],value:'future'}],o=>{data.payments.push({id:next(data.payments,'id'),name:o.name,mode:o.mode,active:true});save();renderPayments();toast('Forma cadastrada')})}function editPayment(id){const p=by(data.payments,id);modal('Editar forma de pagamento',[{id:'name',label:'Nome',value:p.name},{id:'mode',label:'Tipo de baixa',type:'select',options:[{value:'auto',label:'Baixa Automática'},{value:'future',label:'Baixa Futura'}],value:p.mode}],o=>{p.name=o.name;p.mode=o.mode;save();renderPayments();toast('Forma atualizada')})}function deleteClient(id){if(data.sales.some(s=>s.client==id))return toast('Cliente com venda registrada não pode ser excluído');removeById(data.clients,id,'este cliente',renderClients)}function deletePayment(id){removeById(data.payments,id,'esta forma de pagamento',renderPayments)}function filterTable(input,id){const q=input.value.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function renderReports(){const total=data.sales.reduce((a,s)=>a+s.total,0);document.getElementById('reports').innerHTML=shell('Relatórios','Visão consolidada das vendas.')+`<div class="report-cards"><div class="card report-card"><small>Faturamento total</small><strong>${money(total)}</strong></div><div class="card report-card"><small>Itens vendidos</small><strong>${data.sales.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0)}</strong></div><div class="card report-card"><small>Ticket médio</small><strong>${money(total/Math.max(1,data.sales.length))}</strong></div></div><div class="panel"><h3>Resumo por cliente</h3><table class="table"><thead><tr><th>Cliente</th><th>Vendas</th><th>Total vendido</th><th>Recebido</th><th>Pendente</th></tr></thead><tbody>${data.clients.map(c=>{const ss=data.sales.filter(s=>s.client===c.id);return ss.length?`<tr><td><b>${esc(c.name)}</b></td><td>${ss.length}</td><td>${money(ss.reduce((a,s)=>a+s.total,0))}</td><td>${money(ss.filter(s=>s.status==='Recebido').reduce((a,s)=>a+s.total,0))}</td><td>${money(ss.filter(s=>s.status==='Pendente').reduce((a,s)=>a+s.total,0))}</td></tr>`:''}).join('')}</tbody></table></div>`}const titles={dashboard:'Dashboard',sale:'Nova venda',cash:'Caixa',stock:'Estoque',clients:'Clientes',products:'Produtos',events:'Eventos',payments:'Pagamentos',reports:'Relatórios'};function go(v){current=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.getElementById('page-title').textContent=titles[v];({dashboard:renderDashboard,sale:renderSale,cash:renderCash,stock:renderStock,clients:renderClients,products:renderProducts,events:renderEvents,payments:renderPayments,reports:renderReports}[v])();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}window.__pdvRefresh=()=>{go(current)};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));refreshUserIdentity();refreshNotifications();document.addEventListener('change',e=>{if(e.target.classList.contains('cash-check'))updateSelection()});renderDashboard();
</script></body></html>
